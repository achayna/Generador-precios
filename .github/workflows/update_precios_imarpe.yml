name: Actualizar Precios Playa IMARPE (INFOMAR)

on:
  push:
    branches:
      - main
    paths-ignore:
      - "output/**"
  schedule:
    # 6 corridas diarias en hora oficial del Perú (UTC-5):
    # 00:05 PET (05:05 UTC) -> Cambio automático de etiquetas al iniciar nuevo día ("hoy" -> "ayer")
    - cron: "5 5 * * *"
    # 06:30 PET (11:30 UTC), 11:30 PET (16:30 UTC) y 14:30 PET (19:30 UTC)
    - cron: "30 11,16,19 * * *"
    # 08:35 PET (13:35 UTC)
    - cron: "35 13 * * *"
    # 18:00 PET (23:00 UTC)
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "Ventana de días hacia atrás a consultar"
        required: false
        default: "7"
      include_selva:
        description: "Incluir puertos fluviales de SELVA (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: imarpe-infomar-daily-sync
  cancel-in-progress: false

jobs:
  extract-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias Python
        run: pip install -r requirements.txt

      - name: Extraer precios IMARPE o recalcular etiquetas dinámicas del día (UTC-5)
        env:
          TZ: America/Lima
          IMARPE_PROXY_URL: ${{ secrets.IMARPE_PROXY_URL }}
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          EXTRA_FLAGS=""
          if [ "${{ github.event.inputs.include_selva }}" = "true" ]; then
            EXTRA_FLAGS="--include-selva"
          fi
          python main.py --days "$DAYS" --workers 6 --graceful-unreachable $EXTRA_FLAGS

      - name: Publicar artefactos descargables de la ejecución
        uses: actions/upload-artifact@v4
        with:
          name: precios-imarpe-nacional
          path: |
            output/precios_app_movil.json
            output/precios_imarpe_app.json
            output/Precios_Playa_IMARPE_Nacional.xlsx
          retention-days: 30

      - name: Publicar output/ actualizado en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add output/

          if git diff --staged --quiet; then
            echo "Sin cambios en output/. Finalizando en verde."
          else
            FECHA_PE=$(TZ=America/Lima date +'%Y-%m-%d %H:%M PET')
            git commit -m "chore(data): actualizar precios/etiquetas IMARPE (${FECHA_PE}) [skip ci]"
            git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
